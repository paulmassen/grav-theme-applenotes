extends@: default

form:
  fields:
    tabs:
      fields:
        content:
          type: tab
          title: Content
          fields:
            header.emoji:
              type: text
              ordering@: 2
              label: Emoji
              placeholder: 📝
              help: Emoji shown next to the note title. Leave empty to use the theme's default emoji.
              size: small
              validate:
                type: string
                max: 16
            header.pinned:
              type: toggle
              ordering@: 3
              label: Pinned
              default: 0
              help: Pinned notes are listed at the top of the sidebar.
              highlight: 0
              options:
                1: PLUGIN_ADMIN.YES
                0: PLUGIN_ADMIN.NO
              validate:
                type: bool
